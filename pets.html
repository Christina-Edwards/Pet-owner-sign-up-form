<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Management System</title>
</head>
<body>
  <h1>Pet Creator</h1>
  <form id="petForm">
    <input type="text" id="petNameInput" placeholder="Pet's Name" />
    <input type="number" id="petAgeInput" placeholder="Pet's Age" />
    <select id="petSpeciesInput">
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
      <option value="Fish">Fish</option>
    </select>
    <button type="button" id="createPetBtn">Create Pet</button>
  </form>

  <script src="petCreator.js"></script>
  <script src="pets.js"></script>
</body>
</html>
