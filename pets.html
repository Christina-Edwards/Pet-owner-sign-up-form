<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <h1>Pet Creator</h1>

  <form id="petForm" class="d-flex flex-column gap-3">
    <input type="text" id="petNameInput" placeholder="Pet's Name" />
    <input type="number" id="petAgeInput" placeholder="Pet's Age" />
    <select id="petSpeciesInput">
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
      <option value="Fish">Fish</option>
    </select>
    <button id="signUpBtn" type="button" class="btn btn-primary">Sign Up</button>
  </form>

  <div id="ownerList" class="mt-4"></div>

  <!-- Load scripts in correct order -->
  <script src="state.js"></script>
  <script src="petCreator.js"></script>
  <script src="pets.js"></script>
</body>
</html>
