<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Owner Sign-Up</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <h1>Pet Owner Sign-Up</h1>
  <form id="signup-form" class="d-flex flex-column gap-3">
    <input type="text" id="ownerName" placeholder="Owner Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="tel" id="phone" placeholder="Phone" />
    <input type="text" id="city" placeholder="City" />
    <input type="text" id="zip" placeholder="Zip Code" />
    <input type="text" id="petName" placeholder="Pet's Name" />


    <!-- Bonus: Pet Type Selector -->
    <select id="petType">
      <option value="">Select Pet Type</option>
      <option value="dog">Dog</option>
      <option value="cat">Cat</option>
      <option value="fish">Fish</option>
    </select>

    <button type="button" id="signUpBtn" class="btn btn-primary">Sign Up</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
